version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: allan-audiobookrequest_web_1
      APP_PORT: 8000
      PROXY_AUTH_ADD: "false"

  web:
    image: markbeep/audiobookrequest:1@sha256:7b7df351abece608fb84147dc43705f0eb1b350fc1427e0a7e5fea84a7852a19
    restart: on-failure
    environment:
      TZ: America/Sao_Paulo
      ABR_APP__FORWARDED_ALLOW_IPS: "*"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
