version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: allan-bookshelf_server_1
      APP_PORT: 8787
      PROXY_AUTH_WHITELIST: "/api/*"

  server:
    image: ghcr.io/snapetech/bookshelfng:hardcover@sha256:3a9742b72df38ee5920f24a28d11b489c5625a418ba659c1ebff9b6d8a4bf580
    restart: on-failure
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
