version: "3.7"

services:
app_proxy:
  environment:
    APP_HOST: allan-seerrng_server_1
    APP_PORT: 5055
    PROXY_AUTH_WHITELIST: "/api/*"

server:
  image: ghcr.io/snapetech/seerrng:latest@sha256:b046953e499379e70a3b9d006eae163efb3ddc8c7e316cab280b0549a22ffeae
  user: "1000:1000"
  init: true
  restart: on-failure
  environment:
    LOG_LEVEL: info
    PORT: 5055
    TZ: America/Sao_Paulo
  volumes:
    - ${APP_DATA_DIR}/data/config:/app/config
